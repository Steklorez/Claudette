name: Package

# MSIX for Windows and a signed, notarized .dmg for macOS (DESIGN.md §2, "Packaging").
#
# - A tag like v1.2.3 builds signed packages and attaches them to a draft release, whose notes are the version's section
#   of CHANGELOG.md (packaging/release-notes.sh).
# - "Run workflow" builds them for a version you give, without a release.
# - Pull requests that change packaging build unsigned packages, to check the scripts.
# - Each Windows run also leaves the Microsoft Store's packages, store-windows-<arch>: the same files with the Store's
#   publisher, unsigned (the Store signs them), to upload to Partner Center by hand.
#
# Signing uses these secrets, kept in the "release" environment (Settings → Environments), whose protection rules should
# allow only v* tags: then only a tag, not a branch's run of a changed workflow, can reach them. Pull requests build
# unsigned and use no environment.
#   Windows: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID: the Entra app registration that signs with Azure
#            Artifact Signing. It has no secret: it trusts GitHub's OIDC token for this repository's release
#            environment (a federated credential) and holds the Artifact Signing Certificate Profile Signer role on the
#            dotbunny account. A tag or "Run workflow" without them fails rather than leave the package unsigned.
#   macOS:   MACOS_CERTIFICATE_P12 (base64 .p12: the Developer ID Application certificate and its private key) and
#            MACOS_CERTIFICATE_PASSWORD, which sign; APPLE_API_KEY_P8 (base64 .p8), APPLE_API_KEY_ID and APPLE_API_ISSUER
#            (an App Store Connect team key with the Developer role), which notarize. The identity is the certificate's.
#            A tag or "Run workflow" without them fails, as on Windows.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 1.2.3
        required: true
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The version reaches every later step through the environment, never pasted into a script, and must look like a
      # version: "Run workflow" takes it as free text.
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="0.1.$RUN_NUMBER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::'$version' isn't a version such as 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A release's notes are its version's section of CHANGELOG.md (packaging/release-notes.sh), so a tag without one
      # fails here, before anything is built. A pull request reads the latest release's, to check the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
      - name: Release notes
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            VERSION="$(sed -n '/^## \[[0-9]/{s/^## \[\([^]]*\)\].*/\1/p;q;}' CHANGELOG.md)"
          fi
          if ! packaging/release-notes.sh "$VERSION" > /dev/null; then
            echo "::error::CHANGELOG.md has no notes for '$VERSION'. Add its section before tagging (GUIDE.md, \"The changelog\")."
            exit 1
          fi

  # The tests, before a tag's packages become a release (ci.yml, called as a reusable workflow). Pull requests and
  # "Run workflow" leave them to the CI workflow.
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  windows:
    needs: version
    runs-on: windows-latest
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    # id-token: GitHub's OIDC token, which Azure trusts for the release environment, to sign with Artifact Signing.
    permissions:
      contents: read
      id-token: write
    env:
      # The Artifact Signing certificate profile's subject, which the GitHub package's manifest must name exactly.
      # Changing it changes the package's identity, so installed copies couldn't update (DESIGN.md §2).
      MSIX_PUBLISHER: 'CN=dotBunny, O=dotBunny, L=Peterborough, S=Ontario, C=CA'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build MSIX
        shell: pwsh
        env:
          # Partner Center's publisher for Claudette (Product identity), in every Store package: not a secret.
          MSIX_STORE_PUBLISHER: CN=F363E167-1FAD-4382-A179-29A2D849A02A
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/build-msix.ps1 -Version $env:VERSION -Architecture $env:ARCH
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The GitHub package only: the Store's, in artifacts/store, is the Store's to sign.
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        if: github.event_name != 'pull_request'
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: dotbunny
          certificate-profile-name: dotBunny
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Downloaded each run, not restored from a cache another run could have written.
          cache-dependencies: false
      - name: Check the signature
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          foreach ($msix in Get-ChildItem artifacts -Filter *.msix) {
            $signature = Get-AuthenticodeSignature $msix.FullName
            Write-Host "$($msix.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($msix.Name) isn't validly signed: $($signature.StatusMessage)" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claudette-windows-${{ matrix.arch }}
          path: artifacts/*.msix
          if-no-files-found: error
      # The same package with the Store's publisher, unsigned, to upload to Partner Center. Not part of the release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-windows-${{ matrix.arch }}
          path: artifacts/store/*.msix
          if-no-files-found: error
      # Kept out of the package, for reading crash reports' stack traces.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-windows-${{ matrix.arch }}
          path: artifacts/symbols-win-${{ matrix.arch }}/
          if-no-files-found: warn

  macos:
    needs: version
    runs-on: macos-latest
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Certificate and notarization key
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Signed and notarized, or not built: a signed Claudette refuses an update its team didn't sign (DESIGN.md §2,
          # "Updating Claudette").
          if [[ -z "$P12" || -z "$API_KEY" || -z "$API_KEY_ID" || -z "$API_ISSUER" ]]; then
            echo "::error::The release environment needs MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER to sign and notarize the .dmg."
            exit 1
          fi
          keychain="$RUNNER_TEMP/claudette.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/claudette.p12"
          security import "$RUNNER_TEMP/claudette.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/claudette.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The certificate's identity, named by its SHA-1 hash, which nothing else in the keychains can match.
          identities="$(security find-identity -v -p codesigning "$keychain" | grep '"Developer ID Application: ' || true)"
          if [[ "$(grep -c . <<< "$identities")" != 1 ]]; then
            echo "::error::MACOS_CERTIFICATE_P12 should hold one valid Developer ID Application certificate, with its private key. It holds:"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "Signing as $(cut -d '"' -f 2 <<< "$identities")"
          echo "MACOS_SIGNING_IDENTITY=$(awk '{ print $2 }' <<< "$identities")" >> "$GITHUB_ENV"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/claudette-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/claudette-api-key.p8" >> "$GITHUB_ENV"
      - name: Build .dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: packaging/macos/build-dmg.sh "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claudette-macos-${{ matrix.arch }}
          path: artifacts/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-macos-${{ matrix.arch }}
          path: artifacts/symbols-osx-${{ matrix.arch }}/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, tests, windows, macos]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Before the packages: checking out cleans the folder.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      # The packages only: the symbols stay workflow artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: claudette-*
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "${GITHUB_REF#refs/tags/}" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --notes-file "$RUNNER_TEMP/release-notes.md" --title "Claudette $VERSION"
