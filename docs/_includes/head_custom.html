{%- comment -%}
  Light or dark as the reader's system is (GUIDE.md, "Light and dark"), and again when that changes: Claudette's own
  schemes, _sass/color_schemes/claudette-*.scss. The pictures follow the same setting through shot.html, so the page has
  no switch of its own.
{%- endcomment -%}
<script>
  (function () {
    var dark = window.matchMedia('(prefers-color-scheme: dark)');
    function follow() { jtd.setTheme(dark.matches ? 'claudette-dark' : 'claudette-light'); }
    follow();
    dark.addEventListener('change', follow);
  })();
</script>
